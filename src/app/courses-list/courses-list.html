<h2>{{ title }}</h2>
@for(course of courses; track course.id) {
  <div class="elemento-corso">
    <h3>{{ course.title }}</h3>
    <p>{{ course.description }}</p>
    <p>{{ course.price | currency:'EUR'}}</p>
    <p>{{ course.date | date:'longDate' }}</p>
    <p [hidden]="!course.soldOut">Sold Out</p>
    <img  [src]="course.img" [alt]="course.title" width="100">
    @if (course.price < 50){
      <div class="offerta-speciale">Offerta-speciale</div>
    }
    @if (course.onSale){
      <div class="banner-vendita">On Sale!</div>
    }
    <button (click)="viewDetails(course.title)">Vedi dettagli</button>
  </div>
}
